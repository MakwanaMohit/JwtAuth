name: CI/CD Pipeline to AWS EC2 via Docker Hub

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy to EC2
    runs-on: ubuntu-latest

    # Enables the GitHub Deployments tab for production tracking
    environment:
      name: production
      url: http://${{ secrets.EC2_HOST }}:8080

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Build and Push Docker Image to Docker Hub
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/jwtauth:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/jwtauth:${{ github.sha }}

      # 5. SSH into AWS EC2, Pull Image & Run Container
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Log in to Docker Hub on EC2
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Pull the latest image
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/jwtauth:latest

            # Stop and remove old container if running
            docker stop jwtauth-app || true
            docker rm jwtauth-app || true

            # Run new container with production environment variables
            docker run -d \
              --name jwtauth-app \
              --restart always \
              -p 8080:8080 \
              -e SERVER_PORT=8080 \
              -e MONGODB_URI="${{ secrets.MONGODB_URI }}" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              -e CORS_ALLOWED_ORIGINS="${{ secrets.CORS_ALLOWED_ORIGINS }}" \
              ${{ secrets.DOCKERHUB_USERNAME }}/jwtauth:latest

            # Prune unused images to save disk space on EC2
            docker image prune -f
